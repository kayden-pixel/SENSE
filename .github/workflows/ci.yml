name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: Publish the verified debug APK as a clearly marked prerelease
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/check_native.py app/build/outputs/apk/debug/app-debug.apk --json native-debug.json
      - run: python tools/check_native.py app/build/outputs/apk/release/app-release-unsigned.apk --json native-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-elf-audits
          path: native-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: sense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test server/test/*.test.mjs
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
    needs: [android, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sense-debug-apk
          path: public-release
      - name: Prepare public beta files
        run: |
          mv public-release/app-debug.apk public-release/SENSE-beta-debug.apk
          git archive --format=zip --prefix=SENSE/ -o public-release/SENSE-source.zip HEAD
          cd public-release
          sha256sum SENSE-beta-debug.apk SENSE-source.zip > SHA256SUMS.txt
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-beta.${{ github.run_number }}
        run: |
          cat > release-notes.md <<'NOTES'
          Early SENSE beta, debug-signed APK and Apache-2.0 source.

          No owner credentials or server secrets are packaged. Friends explicitly choose separate identities. A public HTTPS backend and an authorized LiveKit deployment must be configured before internet friend/voice/capture sessions work. Sensor and two-phone media behavior still need physical-device validation. See the README status table.

          This CI debug build uses a development signing key. Its signature may differ from locally built APKs; it is not a production signing channel.
          NOTES
          gh release create "$RELEASE_TAG" public-release/* --target "$GITHUB_SHA" --prerelease --title "SENSE beta ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md
