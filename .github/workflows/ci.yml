name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a signed release after live production readiness checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:compileReleaseKotlin
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/check_native.py app/build/outputs/apk/debug/app-debug.apk --json native-debug.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-elf-audits
          path: native-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: sense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test server/test/*.test.mjs
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-reports
          path: app/build/reports/androidTests
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [android, backend, cloudflare, installation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      SENSE_KEYSTORE_PASSWORD: ${{ secrets.SENSE_KEYSTORE_PASSWORD }}
      SENSE_KEY_ALIAS: ${{ secrets.SENSE_KEY_ALIAS }}
      SENSE_KEY_PASSWORD: ${{ secrets.SENSE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision private release signing
        env:
          SENSE_KEYSTORE_BASE64: ${{ secrets.SENSE_KEYSTORE_BASE64 }}
        run: |
          test -n "$SENSE_KEYSTORE_BASE64" || { echo 'Release signing has not been provisioned'; exit 1; }
          umask 077
          printf '%s' "$SENSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sense-release.jks"
          echo "SENSE_KEYSTORE_PATH=$RUNNER_TEMP/sense-release.jks" >> "$GITHUB_ENV"
      - name: Verify official endpoint and package signed release
        run: |
          node tools/check_release.mjs config/production.properties
          chmod +x gradlew
          ./gradlew :app:assembleRelease :release-check:assembleDebug :release-check:assembleDebugAndroidTest
          python tools/check_release_apk.py app/build/outputs/apk/release/app-release.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          python tools/check_native.py app/build/outputs/apk/release/app-release.apk --json native-release.json
      - name: Enable emulator acceleration for the signed APK
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify the signed minified release
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/verify_signed_installation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-installation-reports
          path: signed-installation-reports
      - name: Prepare public beta files
        run: |
          mkdir -p public-release
          cp app/build/outputs/apk/release/app-release.apk public-release/SENSE-beta.apk
          git archive --format=zip --prefix=SENSE/ -o public-release/SENSE-source.zip HEAD
          cd public-release
          sha256sum SENSE-beta.apk SENSE-source.zip > SHA256SUMS.txt
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.2-beta.${{ github.run_number }}
        run: |
          cat > release-notes.md <<'NOTES'
          SENSE beta, release-signed APK and Apache-2.0 source.

          The official HTTPS endpoint and LiveKit authorization passed live readiness checks before packaging. No owner credentials or server secrets are packaged. Friends explicitly choose separate identities. Sensor and two-phone media behavior still require physical-device validation. See the README status table.
          NOTES
          gh release create "$RELEASE_TAG" public-release/* --target "$GITHUB_SHA" --prerelease --title "SENSE beta ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md
