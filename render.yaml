# Deployment proposal: requires a paid persistent disk. Creating this Blueprint
# is an operator action; this file does not provision infrastructure by itself.
services:
  - type: web
    name: sense-api
    runtime: node
    repo: https://github.com/kayden-pixel/SENSE
    branch: main
    region: frankfurt
    plan: starter
    numInstances: 1
    rootDir: server
    buildCommand: node --check src/server.mjs
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: sense-data
      mountPath: /var/data/sense
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.21.0"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_PATH
        value: /var/data/sense/sense.sqlite
      - key: MEDIA_PATH
        value: /var/data/sense/media
      - key: RADAR_SECRET
        generateValue: true
      - key: OWNER_ACCOUNT
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
